<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">

</label>
<label style="position: relative; display: block">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Cyfra 4 z 6</span>
<input type="text" inputmode="numeric" maxlength="1" value="9" style="width: 100%; height: 56px; box-sizing: border-box; border: 1px solid #E0D3C2; border-radius: 12px; background: #FFFCF7; color: #2E241D; font: inherit; font-size: 24px; font-weight: 700; text-align: center; padding: 0">
</label>
<label style="position: relative; display: block">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Cyfra 5 z 6</span>
<input type="text" inputmode="numeric" maxlength="1" value="" style="width: 100%; height: 56px; box-sizing: border-box; border: 2px solid {{accent}}; border-radius: 12px; background: #FFFCF7; color: #2E241D; font: inherit; font-size: 24px; font-weight: 700; text-align: center; padding: 0">
</label>
<label style="position: relative; display: block">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Cyfra 6 z 6</span>
<input type="text" inputmode="numeric" maxlength="1" value="" style="width: 100%; height: 56px; box-sizing: border-box; border: 1px solid #E0D3C2; border-radius: 12px; background: #FFFCF7; color: #2E241D; font: inherit; font-size: 24px; font-weight: 700; text-align: center; padding: 0">
</label>
</div>
<span style="font-size: 13px; color: #5C4E43">Kod jest ważny 10 minut.</span>
</fieldset>

<div style="display: flex; flex-direction: column; gap: 8px">
<a href="Main.dc.html" style="min-height: 52px; border-radius: 14px; background: {{accent}}; color: #FFFCF7; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">Zaloguj się</a>
<button type="button" disabled style="min-height: 44px; border: none; background: none; font: inherit; font-size: 14px; font-weight: 600; color: #5C4E43; display: flex; align-items: center; justify-content: center; gap: 6px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 1.5"/><path d="M10 2.5h4"/></svg>
Wyślij kod ponownie za 0:42</button>
</div>

<div style="display: flex; align-items: center; gap: 12px; font-size: 13px; color: #5C4E43">
<div aria-hidden="true" style="flex: 1; height: 1px; background: #E0D3C2"></div>

<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5C4E43" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>
Użyj aplikacji uwierzytelniającej (kod TOTP)</a>

<p style="margin: auto 0 0; display: flex; align-items: flex-start; gap: 10px; background: #EDE3D5; border-radius: 12px; padding: 12px 14px; font-size: 13px; line-height: 1.45; color: #5C4E43">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6.5L12 13l8.5-6.5"/></svg>
<span><strong style="color: #2E241D; font-weight: 600">Masz zaproszenie?</strong> Zaloguj się numerem lub <span style="white-space: nowrap">e-mailem</span>, na który przyszło.</span></p>
</main>
