<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Konto firmy</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#8A5230}a:hover{color:#6B3A1E}
</style>
</helmet>
<div style="width: 100%; min-height: 900px; box-sizing: border-box; background: #F3ECE2; color: #2E241D; font-family: Figtree, system-ui, sans-serif; line-height: 1.3">

<header style="background: #FFFCF7; border-bottom: 1px solid #E0D3C2">
<div style="max-width: 1280px; margin: 0 auto; box-sizing: border-box; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap">
<div style="display: flex; align-items: center; gap: 14px; min-height: 44px">
<span style="font-size: 13px; font-weight: 700; letter-spacing: 0.01em; color: #2E241D"><span style="letter-spacing: 0.16em; font-weight: 700">EQUENOR</span></span>
</div>
<div style="display: flex; align-items: center; gap: 14px">
<button type="button" aria-haspopup="menu" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px 0 6px; border-radius: 999px; border: 1px solid #907D6A; background: #FFFCF7; font: inherit; font-size: 14px; font-weight: 600; color: #2E241D">
<span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 16px; background: #EDE3D5; color: #6B3A1E; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">D</span>
Damian
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
</button>
</div>
</div>
</header>

<main style="max-width: 1280px; margin: 0 auto; box-sizing: border-box; padding: 32px 20px 40px; display: flex; justify-content: center">

<section aria-labelledby="firma-title" style="width: 100%; max-width: 600px; box-sizing: border-box; background: #FFFCF7; border: 1px solid #E0D3C2; border-radius: 20px; box-shadow: 0 1px 2px rgba(46,36,29,.06), 0 4px 12px -6px rgba(46,36,29,.14); display: flex; flex-direction: column">

<div style="display: flex; align-items: center; gap: 16px; padding: 28px 32px 0">
<div aria-hidden="true" style="width: 56px; height: 56px; flex: none; border-radius: 28px; background: #EDE3D5; color: #5C4E43; display: flex; align-items: center; justify-content: center">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V6.5L12 3l8 3.5V20"/><path d="M2.5 20h19"/><path d="M8.5 9h1M14.5 9h1M8.5 13h1M14.5 13h1"/><path d="M10 20v-3.5h4V20"/></svg>
</div>
<h1 id="firma-title" style="margin: 0; font-size: 26px; font-weight: 700; line-height: 32px">Załóż konto firmy</h1>
</div>

<form aria-labelledby="firma-title" style="margin: 0; padding: 24px 32px 28px; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="nip" style="font-size: 14px; font-weight: 600">NIP <span aria-hidden="true" style="color: #86301F">*</span></label>
<div style="display: flex; gap: 10px">
<input id="nip" type="text" inputmode="numeric" value="123-456-32-18" required style="flex: 1; min-width: 0; min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; border: 1px solid #907D6A; background: #FFFCF7; font: inherit; font-size: 15px; font-weight: 600; color: #2E241D; font-variant-numeric: tabular-nums; letter-spacing: 0.02em">
<button type="button" style="flex: none; min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid #907D6A; background: #FFFCF7; font: inherit; font-size: 14px; font-weight: 600; color: #2E241D; display: inline-flex; align-items: center; gap: 8px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7.5 10.5L12 15l4.5-4.5"/><path d="M4.5 19.5h15"/></svg>
Pobierz dane z rejestru</button>
</div>
<span role="status" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: #D4EADC; color: #2D523D; font-size: 13px; font-weight: 700">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
Nazwa i adres pobrane z rejestru</span>
</div>

<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">
<span>Nazwa firmy <span aria-hidden="true" style="color: #86301F">*</span></span>
<input type="text" value="Stajnie Lipowe sp. z o.o." required autocomplete="organization" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; border: 1px solid #907D6A; background: #FFFCF7; font: inherit; font-size: 15px; font-weight: 400; color: #2E241D">
</label>

<fieldset style="margin: 0; padding: 0; border: none; min-width: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="float: left; width: 100%; padding: 0; margin: 2px 0 2px; font-size: 15px; font-weight: 700; line-height: 20px">Adres siedziby</legend>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">
<span>Ulica i numer <span aria-hidden="true" style="color: #86301F">*</span></span>
<input type="text" value="ul. Lipowa 12" required autocomplete="street-address" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; border: 1px solid #907D6A; background: #FFFCF7; font: inherit; font-size: 15px; font-weight: 400; color: #2E241D">
</label>
<div style="display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 10px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">
<span>Kod pocztowy <span aria-hidden="true" style="color: #86301F">*</span></span>
<input type="text" value="05-520" required autocomplete="postal-code" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; border: 1px solid #907D6A; background: #FFFCF7; font: inherit; font-size: 15px; font-weight: 400; color: #2E241D; font-variant-numeric: tabular-nums">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">
<span>Miejscowość <span aria-hidden="true" style="color: #86301F">*</span></span>
<input type="text" value="Konstancin-Jeziorna" required autocomplete="address-level2" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; border: 1px solid #907D6A; background: #FFFCF7; font: inherit; font-size: 15px; font-weight: 400; color: #2E241D">
</label>
</div>
</fieldset>

<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">
<span>E-mail do faktur <span aria-hidden="true" style="color: #86301F">*</span></span>
<input type="email" value="f•••@stajnielipowe.pl" required autocomplete="email" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; border: 1px solid #907D6A; background: #FFFCF7; font: inherit; font-size: 15px; font-weight: 400; color: #2E241D">
</label>

</form>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 32px; border-top: 1px solid #E0D3C2">
<a href="PanelWitaj.dc.html" style="min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; padding: 0 16px; border-radius: 12px; border: 1px solid #907D6A; background: #FFFCF7; color: #2E241D; text-decoration: none; font-size: 14px; font-weight: 600">Anuluj</a>
<a href="PanelZalozStajnie.dc.html" style="min-height: 48px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 20px; border-radius: 12px; background: {{accent}}; color: #FFFCF7; text-decoration: none; font-size: 15px; font-weight: 700">
Załóż konto firmy
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></a>
</div>

</section>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8A5230","options":["#8A5230","#665A40","#744A5A","#5E5B40"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#8A5230' };
}
}
</script>
</body>
</html>
