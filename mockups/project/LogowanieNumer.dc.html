<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Logowanie – telefon albo e-mail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#8A5230}a:hover{color:#6B3A1E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3ECE2; color: #2E241D; font-family: Figtree, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<header style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 56px 20px 8px; text-align: center">
<div aria-hidden="true" style="width: 60px; height: 60px; border-radius: 30px; background: #EDE3D5; color: #5C4E43; display: flex; align-items: center; justify-content: center">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 20.5C5.1 18.6 4 15.6 4 12.5a8 8 0 0 1 16 0c0 3.1-1.1 6.1-3 8"/><path d="M5 20.5h3.5M15.5 20.5H19"/><path d="M7.5 9.5v.5M16.5 9.5v.5M6.8 14v.5M17.2 14v.5"/></svg>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
<span style="font-size: 28px; font-weight: 700; line-height: 1; color: #2E241D; white-space: nowrap"><span style="letter-spacing: 0.16em; margin-right: -0.16em; font-weight: 700">EQUENOR</span></span>
<span lang="en" style="font-size: 14px; font-weight: 500; line-height: 1.15; color: #5C4E43">Equestrian Management, Refined</span>
</div>
</header>

<main style="flex: 1; display: flex; flex-direction: column; gap: 28px; padding: 32px 20px 24px">
<h1 style="margin: 0; font-size: 24px; font-weight: 700">Zaloguj się</h1>

<form style="margin: 0; display: flex; flex-direction: column; gap: 20px">
<div role="group" aria-label="Zaloguj się przez" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: #EDE3D5; border-radius: 12px; padding: 3px">
<button type="button" aria-pressed="true" style="min-height: 44px; border: 1px solid #907D6A; border-radius: 10px; background: #FFFCF7; color: {{accent}}; font: inherit; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6.5" y="3" width="11" height="18" rx="2"/><path d="M11 17.5h2"/></svg>
Telefon</button>
<button type="button" aria-pressed="false" style="min-height: 44px; border: 1px solid transparent; border-radius: 10px; background: transparent; color: #5C4E43; font: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6.5L12 13l8.5-6.5"/></svg>
E-mail</button>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="tel" style="font-size: 14px; font-weight: 600">Numer telefonu</label>
<div style="display: flex; align-items: stretch; height: 56px; box-sizing: border-box; border: 2px solid {{accent}}; border-radius: 12px; background: #FFFCF7; overflow: hidden">
<span style="flex: none; display: flex; align-items: center; padding: 0 14px; border-right: 1px solid #E0D3C2; background: #F3ECE2; font-size: 17px; font-weight: 600; color: #2E241D; font-variant-numeric: tabular-nums">+48</span>
<input id="tel" type="tel" inputmode="tel" autocomplete="tel-national" required value="600 *** 412" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; padding: 0 14px; font: inherit; font-size: 20px; font-weight: 700; color: #2E241D; font-variant-numeric: tabular-nums; letter-spacing: 0.02em">
</div>
</div>
<a href="Logowanie.dc.html" style="min-height: 52px; border-radius: 14px; background: {{accent}}; color: #FFFCF7; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 700">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>
Wyślij kod</a>
</form>

<div style="margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center">
<a href="PanelLogowanie.dc.html" style="min-height: 44px; display: inline-flex; align-items: center; padding: 0 4px; font-size: 14px; font-weight: 600; color: {{accent}}; text-decoration: underline; text-underline-offset: 2px">Załóż konto firmy</a>
<a style="min-height: 44px; display: inline-flex; align-items: center; padding: 0 4px; font-size: 13px; font-weight: 600; color: {{accent}}; text-decoration: underline; text-underline-offset: 2px; cursor: pointer">Polityka prywatności</a>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8A5230","options":["#8A5230","#665A40","#744A5A","#5E5B40"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#8A5230' };
}
}
</script>
</body>
</html>
